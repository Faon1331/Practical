<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Характеристики заведений по отзывам</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="page">
  <h1>Характеристики заведений по отзывам 2ГИС</h1>
  <p class="muted">Учебная практика НГТУ, кейс 2ГИС. Модель: TF-IDF (слова и биграммы) +
    логистическая регрессия. Описание API: <a href="/docs">/docs</a></p>

  <section>
    <h2>Анализ отзыва</h2>
    <textarea id="review" rows="5" placeholder="Вставьте текст отзыва">Всегда очень вкусный кофе и свежие десерты) место тихое и спокойное, для посиделок вдвоём идеально)</textarea>
    <div class="row">
      <button id="btn-predict">Определить характеристики</button>
      <label><input type="checkbox" id="show-all"> показать все 19</label>
    </div>
    <div id="predict-result"></div>
  </section>
</div>
<script src="/static/app.js"></script>
</body>
</html>
